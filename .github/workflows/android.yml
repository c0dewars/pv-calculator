name: Android build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --tests 'io.github.c0dewars.pvcalculator.domain.*'

      # Release signing: the keystore lives in the repository secrets, never in the code.
      # Without it (e.g. on forks) the APKs are signed with a temporary debug key.
      - name: Set up release signing
        id: signing
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_BASE64: ${{ secrets.PV_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PV_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PV_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::warning::Release signing credentials are incomplete. This run will build test APKs and skip publishing a release."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "PV_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build APKs
        env:
          PV_KEYSTORE_PASSWORD: ${{ secrets.PV_KEYSTORE_PASSWORD }}
          PV_KEY_ALIAS: ${{ secrets.PV_KEY_ALIAS }}
          PV_KEY_PASSWORD: ${{ secrets.PV_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: pvcalculator-apks
          path: app/build/outputs/apk/release/*.apk

      - name: Publish release (tags only)
        if: steps.signing.outputs.ready == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk

      # Manual run ("Run workflow" in the Actions tab): publish a release for the app's
      # current versionName (e.g. v1.1.0) unless that release already exists.
      - name: Read app version
        id: version
        if: steps.signing.outputs.ready == 'true' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release (manual run)
        if: steps.signing.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: PV Calculator ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Download **app-arm64-v8a-release.apk** for most Android phones, or **app-universal-release.apk** if that one doesn't install.
            Allow installing from unknown sources when Android asks.
          files: app/build/outputs/apk/release/*.apk
